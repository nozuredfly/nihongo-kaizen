<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>作業日本語</title>
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業日本語">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%231f7a4d'/%3E%3Ctext x='90' y='118' font-size='86' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E日%3C/text%3E%3C/svg%3E">
<script>
(function(){
  const icon="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%231f7a4d'/%3E%3Ctext x='90' y='118' font-size='86' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E日%3C/text%3E%3C/svg%3E";
  const m={name:"作業日本語成長アプリ",short_name:"作業日本語",start_url:location.href.split('#')[0],display:"standalone",background_color:"#f4f7f2",theme_color:"#1f7a4d",icons:[{src:icon,sizes:"180x180",type:"image/svg+xml"}]};
  const l=document.createElement('link');l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));
  document.head.appendChild(l);
})();
</script>
<style>
:root{--g:#1f7a4d;--g2:#e3f2e9;--bg:#f4f7f2;--tx:#1d2a22;--sub:#5d6b62;--warn:#d9822b;--gold:#f2b01e;--blue:#2d6cdf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 9px;font-size:15px}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.id{color:var(--sub);font-size:13px}
h2{font-size:16px;margin:0 0 8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:bold;background:var(--g);color:#fff;margin-top:10px}
.btn.sub{background:var(--g2);color:var(--g)}
.btn.line{background:#06c755}.btn.blue{background:var(--blue)}.btn.warn{background:var(--warn)}
.btn.sm{padding:9px;font-size:14px;margin-top:0}
.btn:disabled{opacity:.4}
select,input,textarea{width:100%;font-size:16px;padding:11px;border:1px solid #cfd8d2;border-radius:12px;background:#fff;font-family:inherit}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.lesson{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lesson .ic{font-size:28px;width:40px;text-align:center}
.lesson .t{flex:1;min-width:0}.lesson .t b{display:block;font-size:16px}
.dots{font-size:15px;letter-spacing:2px;color:var(--g);white-space:nowrap;text-align:right}
.lvbar{height:10px;background:#dde5df;border-radius:6px;overflow:hidden;margin:6px 0}
.lvbar i{display:block;height:100%;background:var(--g)}
.step{font-size:13px;font-weight:bold;color:#fff;background:var(--g);display:inline-block;border-radius:8px;padding:2px 8px;margin-bottom:6px}
.boss{background:#fff8e6;border-left:5px solid var(--gold);padding:12px;border-radius:10px}
.reply{background:var(--g2);border-left:5px solid var(--g);padding:12px;border-radius:10px}
.jp{font-size:23px;font-weight:bold;line-height:1.4}
.kana{color:var(--sub);font-size:14px}.romaji{color:var(--g);font-size:15px}.idtx{font-size:15px;margin-top:4px}
.spk{border:0;background:#fff;border-radius:10px;padding:6px 10px;font-size:14px;margin-top:6px}
.starrow{display:flex;justify-content:center;gap:4px;margin:8px 0}
.star{font-size:46px;border:0;background:none;color:#d5dbd7;padding:0 2px;line-height:1}
.star.on{color:var(--gold)}.star:disabled{opacity:.5}
.cnt{text-align:center;font-size:15px;margin-top:4px}
.clear{text-align:center;font-size:17px;font-weight:bold;color:var(--g);background:var(--g2);border-radius:12px;padding:10px;margin-top:10px}
.phrase{border-bottom:1px solid #e8ece9;padding:10px 0}
.phrase:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #e3e8e5;padding:6px 4px;text-align:left;vertical-align:top}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.small{font-size:12px;color:var(--sub)}
.tag{display:inline-block;background:var(--g2);color:var(--g);border-radius:8px;padding:2px 8px;font-size:12px}
.fwrap{position:relative}
.fwrap textarea{resize:none;overflow:hidden;line-height:1.5;padding-right:46px;min-height:46px;display:block}
.clr{position:absolute;right:6px;top:7px;width:32px;height:32px;border-radius:50%;border:0;background:#e3e8e5;color:#5d6b62;font-size:15px}
.opt{display:block;width:100%;text-align:left;border:2px solid #cfd8d2;border-radius:12px;padding:12px;font-size:16px;margin-top:8px;background:#fff;color:var(--tx)}
.act{flex:1;border:2px solid #cfd8d2;background:#fff;border-radius:12px;padding:12px 4px;font-size:15px;font-weight:bold;color:var(--sub)}
.act.on.ok{border-color:var(--g);background:var(--g2);color:var(--g)}.act.on.ng{border-color:#c0392b;background:#fdecea;color:#c0392b}.act.on.pending{border-color:var(--warn);background:#fff3e0;color:var(--warn)}
.btn.big{font-size:22px;padding:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:2px solid #cfd8d2;border-radius:20px;padding:7px 12px;font-size:15px;background:#fff;color:var(--tx)}
.chip input{width:auto;margin:0}.chip.on{border-color:var(--g);background:var(--g2);color:var(--g);font-weight:bold}
.help{display:block;width:100%;margin-top:8px;border:2px dashed #2d6cdf;background:#eef3fd;color:#2d6cdf;border-radius:12px;padding:10px;font-size:15px;font-weight:bold;text-align:left}
.mini{border:0;background:var(--g2);color:var(--g);border-radius:8px;padding:8px 10px;font-size:14px}
</style>
</head>
<body>
<header>
  <button id="backBtn" style="display:none" onclick="back()">◀</button>
  <h1>作業日本語</h1>
  <button onclick="go('book')">📖</button>
  <button onclick="go('records')">📊</button>
  <button onclick="admin('edit')">✏️</button>
  <button onclick="admin('settings')">⚙</button>
</header>
<main id="app"></main>

<script>
/* ======================================================
   初期教材（シートが空のときだけ使う。以後はシートの「教材」が正本）
   ====================================================== */
const DEFAULT={levels:[
  {lv:1,name:"あいさつと仕事の始まり・終わり",name_id:"Salam dan awal-akhir kerja"},
  {lv:2,name:"作業の指示",name_id:"Instruksi kerja"}],
 lessons:[
  {key:"L1-01",lv:1,order:1,icon:"🌅",title:"朝のあいさつ",title_id:"Salam pagi",scene:"朝、会ったとき",scene_id:"Pagi hari, saat bertemu.",boss:"おはようございます。",boss_id:"Selamat pagi.",reply:"おはようございます。",kana:"おはようございます",romaji:"Ohayō gozaimasu.",reply_id:"Selamat pagi."},
  {key:"L1-02",lv:1,order:2,icon:"🌇",title:"帰りのあいさつ",title_id:"Salam pulang kerja",scene:"仕事が終わって帰るとき",scene_id:"Pekerjaan selesai, waktunya pulang.",boss:"お疲れ様でした。",boss_id:"Terima kasih atas kerja kerasnya.",reply:"お疲れ様でした。",kana:"おつかれさまでした",romaji:"Otsukaresama deshita.",reply_id:"Terima kasih atas kerja kerasnya."},
  {key:"L1-03",lv:1,order:3,icon:"☕",title:"休憩の指示",title_id:"Perintah istirahat",scene:"休憩の時間",scene_id:"Waktu istirahat.",boss:"休憩です。",boss_id:"Sekarang istirahat.",reply:"はい、分かりました。",kana:"はい、わかりました",romaji:"Hai, wakarimashita.",reply_id:"Ya, saya mengerti."},
  {key:"L1-04",lv:1,order:4,icon:"🍙",title:"お昼休憩の指示",title_id:"Perintah istirahat siang",scene:"お昼の時間",scene_id:"Waktu makan siang.",boss:"お昼休憩です。",boss_id:"Sekarang istirahat siang.",reply:"はい、分かりました。",kana:"はい、わかりました",romaji:"Hai, wakarimashita.",reply_id:"Ya, saya mengerti."},
  {key:"L1-05",lv:1,order:5,icon:"🧑‍🌾",title:"仕事の始まり",title_id:"Awal kerja",scene:"朝、仕事が始まるとき",scene_id:"Pagi, saat pekerjaan akan dimulai.",boss:"仕事が始まります。",boss_id:"Pekerjaan akan dimulai.",reply:"今日の仕事は何ですか？",kana:"きょうのしごとはなんですか",romaji:"Kyō no shigoto wa nan desu ka?",reply_id:"Apa pekerjaan hari ini?"},
  {key:"L1-06",lv:1,order:6,icon:"🧹",title:"仕事の終わり",title_id:"Akhir kerja",scene:"今日の仕事が終わったとき",scene_id:"Saat pekerjaan hari ini selesai.",boss:"今日の仕事は終わりました。",boss_id:"Pekerjaan hari ini sudah selesai.",reply:"はい、分かりました。後片付けをします。",kana:"はい、わかりました。あとかたづけをします",romaji:"Hai, wakarimashita. Atokatazuke o shimasu.",reply_id:"Ya, saya mengerti. Saya akan beres-beres."}
 ]};
const LIMIT=3;   // 合格（理解○＋行動✓）を3回でクリア。クリア後は記録しない

/* ===== 保存 ===== */
const S={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},
         set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('保存できませんでした')}}};
const APP_VER='v2.2';
/* 5番「仕事の始まり」に日本人の言葉が無い古い教材を自動で直す（シートから読んだ時も） */
function fixCurriculum(c){
  let fixed=null;const x=c.lessons.find(l=>l.key==='L1-05');
  if(x&&!String(x.boss||'').trim()){Object.assign(x,DEFAULT.lessons.find(l=>l.key==='L1-05'),{updated:today()});fixed=x}
  return fixed;
}
const CUR=()=>{const c=S.get('kj_curriculum',DEFAULT);const f=fixCurriculum(c);if(f&&c!==DEFAULT)localStorage.setItem('kj_curriculum',JSON.stringify(c));return c};
const levels=()=>CUR().levels.slice().sort((a,b)=>a.lv-b.lv);
const lessonsOf=lv=>CUR().lessons.filter(x=>+x.lv===+lv&&!x.deleted).sort((a,b)=>a.order-b.order);
const lessonBy=key=>CUR().lessons.find(x=>x.key===key);
const students=()=>S.get('kj_students',[]);
const records=()=>S.get('kj_records',[]);
const curName=()=>S.get('kj_cur','');
const today=()=>{const d=new Date();return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')};
let st={screen:'home',key:null,stars:0,editLv:1,editKey:null,prev:'home',unlocked:false};

/* ===== 共通 ===== */
function go(s){st.prev=st.screen;st.screen=s;render();scrollTo(0,0)}
function back(){go(st.screen==='lessonEdit'?'edit':st.screen==='taskRun'&&st.prev==='taskPending'?'taskPending':st.screen==='taskRun'&&st.prev==='taskHist'?'taskHist':'home')}
function render(){document.getElementById('backBtn').style.display=st.screen==='home'?'none':'';
  ({home:Home,lesson:Lesson,book:Book,records:Records,settings:Settings,edit:Edit,lessonEdit:LessonEdit,pending:Pending,taskNew:TaskNew,taskRun:TaskRun,taskPending:TaskPending,taskHist:TaskHist})[st.screen]()}
const $=id=>document.getElementById(id);
const $app=()=>$('app');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starStr=n=>'★'.repeat(n)+'☆'.repeat(5-n);
/* 合格＝意味が分かった（理解チェック○ または チェックなし）＋ 正しく作業できた（✓）。古い記録は合格扱い */
const isPass=r=>r.action===undefined?true:(r.action==='ok'&&r.understood!==false);
const attempts=(name,key)=>records().filter(r=>r.name===name&&r.key===key).length;
const count=(name,key)=>records().filter(r=>r.name===name&&r.key===key&&isPass(r)).length;
const pendings=()=>records().filter(r=>r.action==='pending');
const detailMode=()=>S.get('kj_detail',false);   // ふだんは「かんたん」：オッケーです の1タップ
const checkOn=()=>detailMode()&&S.get('kj_check',true);
const needCheck=x=>checkOn()&&!!x.boss&&!!String(x.boss_id||'').trim();
/* 理解チェックの選択肢：正解＋ほかの教材の訳から2つ */
function makeOpts(x){
  const pool=[...new Set(CUR().lessons.filter(l=>!l.deleted&&l.key!==x.key&&l.boss_id&&l.boss_id!==x.boss_id).map(l=>l.boss_id))];
  const extra=['Tolong bawa alat ini.','Hari ini hujan.','Ayo pulang sekarang.'].filter(t=>t!==x.boss_id&&!pool.includes(t));
  const sh=a=>a.map(v=>[Math.random(),v]).sort((p,q)=>p[0]-q[0]).map(v=>v[1]);
  return sh([x.boss_id,...sh(pool).concat(extra).slice(0,2)]);
}
const cleared=(name,key)=>count(name,key)>=LIMIT;
const lvDone=(name,lv)=>{const ls=lessonsOf(lv);return ls.length>0&&ls.every(x=>cleared(name,x.key))};
function lvOpen(name,lv){if(!S.get('kj_lock',false))return true;   // ふだんは鍵なし（現場の指示はレベルを待てない）
  const ls=levels();const i=ls.findIndex(l=>l.lv===lv);return i<=0||lvDone(name,ls[i-1].lv)}
/* ===== 音声（iPhone・Android対策版） ===== */
let JA_VOICE=null,ID_VOICE=null,audioUnlocked=false;
function pickVoice(){
  if(!('speechSynthesis'in window))return;
  const vs=speechSynthesis.getVoices();
  JA_VOICE=vs.find(v=>v.lang==='ja-JP'&&/Kyoko|O-ren|Google|Hattori/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null;
  ID_VOICE=vs.find(v=>/^(id|in)[-_]/i.test(v.lang)&&/Damayanti|Google/i.test(v.name))||vs.find(v=>/^(id|in)([-_]|$)/i.test(v.lang))||null;
}
/* 研修生への指示（インドネシア語の音声） */
const AUTO_JA='日本語で言ってください。',AUTO_ID='Silakan ucapkan dalam bahasa Jepang.';
/* 追加の指示（任意）＋ 必ず「日本語で言ってください。」を付ける（追加の指示に「bahasa Jepang」が入っていれば重ねない） */
const promptId=x=>AUTO_ID;   // 指示はいつも同じ（日本人の言葉と重ならないように、追加の指示は使わない）
const promptJa=x=>AUTO_JA;
/* 日本人の言葉（日本語）→ 指示（インドネシア語）を続けて再生 */
function playScene(x){
  const seq=[];
  if(x.boss)seq.push({t:x.boss,lang:'ja'});
  if(st.screen==='lesson'&&needCheck(x)&&st.understood===null&&count(curName(),x.key)<LIMIT)seq.push({t:'Apa artinya?',lang:'id'});
  else seq.push({t:promptId(x),lang:'id'});
  speakSeq(seq);
}
function mkUtter(t,lang){
  const u=new SpeechSynthesisUtterance(t);
  if(lang==='id'){u.lang='id-ID';u.rate=.9;if(ID_VOICE)u.voice=ID_VOICE}
  else{u.lang='ja-JP';u.rate=.85;if(JA_VOICE)u.voice=JA_VOICE}
  u.volume=1;u.pitch=1;
  u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast((lang==='id'?'インドネシア語':'日本語')+'の音声エラー：'+e.error)};
  return u;
}
/* 複数の文を一度にまとめて予約（iPhoneはタップ直後に予約しないと鳴らない） */
function speakSeq(seq){
  if(!('speechSynthesis'in window))return toast('この端末は音声に対応していません');
  seq=seq.filter(s=>s.t);if(!seq.length)return;
  if(!JA_VOICE||!ID_VOICE)pickVoice();
  if(seq.some(s=>s.lang==='id')&&!ID_VOICE)toast('インドネシア語の声が端末にありません（⚙の音声テストで確認）');
  const run=()=>{speechSynthesis.resume();window._uq=seq.map(s=>{const u=mkUtter(s.t,s.lang);speechSynthesis.speak(u);return u})};
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(run,250)}else run();
}
function speak(t,lang='ja'){speakSeq([{t,lang}])}
function unlockAudio(){   // iPhoneは最初のタップで一度鳴らさないと音が出ないことがある
  if(audioUnlocked||!('speechSynthesis'in window))return;audioUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
}
function voiceTest(){
  pickVoice();
  const n=speechSynthesis?speechSynthesis.getVoices().length:0;
  const ng='<b style="color:#c0392b">見つかりません</b>';
  $('vinfo').innerHTML=`音声の数：${n}<br>日本語の声：${JA_VOICE?esc(JA_VOICE.name):ng}<br>インドネシア語の声：${ID_VOICE?esc(ID_VOICE.name):ng}`;
  speakSeq([{t:'おはようございます。音声のテストです。',lang:'ja'},{t:'Silakan ucapkan dalam bahasa Jepang.',lang:'id'}]);
}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
document.addEventListener('touchend',unlockAudio,{once:true});
document.addEventListener('click',unlockAudio,{once:true});
const spk=(t,label='🔊')=>t?`<button class="spk" data-t="${esc(t)}" onclick="speak(this.dataset.t)">${label}</button>`:'';
function nameSelect(){const ss=students(),nm=curName();
  return `<select onchange="S.set('kj_cur',this.value);render()">${ss.map(s=>`<option ${s===nm?'selected':''}>${esc(s)}</option>`).join('')}</select>`}
function admin(s){const pin=S.get('kj_pin','');
  if(pin&&!st.unlocked){const p=prompt('管理者の暗証番号');if(p!==pin)return toast('暗証番号がちがいます');st.unlocked=true}
  go(s)}

/* ===== ホーム ===== */
function Home(){
  const ss=students();
  if(!ss.length){$app().innerHTML=`<div class="card"><h2>研修生を登録 / Daftar nama</h2>
    <p class="id">名前はLINE登録の名前と同じにしてください。</p>
    <input id="newName" placeholder="例: Budi"><button class="btn" onclick="addStudent()">登録</button></div>`;return}
  if(!ss.includes(curName())){S.set('kj_cur',ss[0]);return render()}
  const nm=curName(),td=records().filter(r=>r.name===nm&&r.date===today()),tt=tasks().filter(t=>t.name===nm&&t.date===today()),pt=pendTasks().length;
  let h=`<div class="card"><h2>研修生 / Nama</h2>${nameSelect()}
    <button class="btn big" onclick="newTask()">📋 今日の作業指示</button>
    ${pt?`<button class="btn warn" onclick="go('taskPending')">⏳ 作業確認待ち ${pt}件</button>`:''}
    ${pendings().length?`<button class="btn warn" onclick="go('pending')">⏳ 会話練習の作業確認 ${pendings().length}件</button>`:''}
    <div class="row" style="margin-top:10px"><button class="btn sub sm" onclick="go('taskHist')">🗂 指示の履歴</button><button class="btn line sm" ${td.length||tt.length?'':'disabled'} onclick="sendLine()">📩 今日の結果をLINE</button></div>
    <div class="small" style="margin-top:8px">今日：作業指示 ${tt.length}件・会話練習 ${td.length}件</div></div>
    <div class="card" style="background:transparent;box-shadow:none;padding:4px 4px 0"><h2>🗣 会話練習（あいさつ・作業の言葉）</h2></div>`;
  levels().forEach(L=>{
    const open=lvOpen(nm,L.lv),ls=lessonsOf(L.lv);
    h+=`<div class="card"><h2>${open?'':'🔒 '}レベル${L.lv}　${esc(L.name)}</h2><div class="id">Level ${L.lv} — ${esc(L.name_id)}</div>`;
    if(!ls.length){h+=`<p class="small">教材は準備中です / Materi segera hadir.</p></div>`;return}
    const c=ls.filter(x=>cleared(nm,x.key)).length;

function addStudent(){const v=($('newName').value||'').trim();if(!v)return;

function openLesson(key){st.key=key;st.stars=0;st.understood=null;st.picked='';st.act='pending';st.opts=makeOpts(lessonBy(key));go('lesson');
  if(S.get('kj_autoplay',true))playScene(lessonBy(key))}   // 開いたら自動で「日本語→インドネシア語の指示」
function Lesson(){
  const x=lessonBy(st.key),nm=curName(),n=count(nm,x.key),done=n>=LIMIT,tries=attempts(nm,x.key);
  const ls=lessonsOf(x.lv),i=ls.findIndex(l=>l.key===x.key),chk=needCheck(x)&&!done,answered=st.understood!==null;

  <h2>${esc(x.icon)} ${esc(x.title)} <span class="id">/ ${esc(x.title_id)}</span></h2>
  <div class="id">📍 ${esc(x.scene)}<br>${esc(x.scene_id)}</div></div>
  <button class="btn blue" onclick="playScene(lessonBy(st.key))">▶ 再生 / Putar</button>
  <div class="card" style="margin-top:12px"><span class="step">① 聞く / Dengar</span>`;
  h+=x.boss?`<div class="boss"><div class="jp">「${esc(x.boss)}」</div>${chk&&!answered?'':`<div class="idtx">🇮🇩 ${esc(x.boss_id)}</div>`}${spk(x.boss,'🔊 日本語')}
    ${x.boss_id&&!(chk&&!answered)?`<button class="help" data-t="${esc(x.boss_id)}" onclick="speak(this.dataset.t,'id')">🇮🇩 分からない時：意味をインドネシア語で聞く</button>`:''}</div>`
    :`<div class="boss"><div class="idtx">研修生から先に話します。<br>🇮🇩 Anda yang bicara duluan.</div></div>`;
  if(chk){
    h+=`<div style="margin-top:12px"><span class="step">② わかる / Paham?</span>
    <p class="idtx" style="margin:4px 0"><b>Apa artinya?</b> <span class="small">（どういう意味？ 研修生にタップしてもらう）</span></p>`;
    st.opts.forEach((o,k)=>{const ok=o===x.boss_id,sel=o===st.picked;
      const bg=!answered?'#fff':ok?'#e3f2e9':sel?'#fdecea':'#fff',bd=!answered?'#cfd8d2':ok?'#1f7a4d':sel?'#c0392b':'#e3e8e5';
      h+=`<button class="opt" style="background:${bg};border-color:${bd}" ${answered?'disabled':''} onclick="pickOpt(${k})">${answered&&ok?'✅ ':answered&&sel?'❌ ':''}${esc(o)}</button>`});
    if(answered)h+=`<p class="small" style="text-align:center">${st.understood?'意味が分かりました / Benar!':'意味を説明してから次へ（Tidak apa-apa）'}</p>`;
    h+=`</div>`;
  }
  h+=`<div style="margin-top:12px"><span class="step">${chk?'③':'②'} 言う / Ucapkan</span>
  <div class="reply"><div class="idtx" style="margin:0 0 6px"><b>🇮🇩 ${esc(promptId(x))}</b><br><span class="small">（${esc(promptJa(x))}）</span>
    <button class="spk" data-t="${esc(promptId(x))}" onclick="speak(this.dataset.t,'id')">🔊 Indonesia</button></div>
    <div class="jp">「${esc(x.reply)}」</div><div class="kana">${esc(x.kana)}</div>
    <div class="romaji">${esc(x.romaji)}</div><div class="idtx">🇮🇩 ${esc(x.reply_id)}</div>${spk(x.reply,'🔊 お手本 / Contoh')}

  if(done){h+=`<div class="card"><div class="clear">🏆 クリア済み / Sudah lulus</div>
    <p class="small" style="text-align:center">合格${LIMIT}回でクリアしました。記録はしません。会話練習として自由に使えます。<br>Sekarang bebas dipakai untuk latihan percakapan.</p></div>`}
  else if(!detailMode()){

    <button class="btn big" onclick="quickRecord(true)">👌 オッケーです</button>
    <button class="btn sub" onclick="quickRecord(false)">🔁 もう一度</button></div>`}

    <div class="starrow">${[1,2,3,4,5].map(k=>`<button class="star ${k<=st.stars?'on':''}" onclick="tapStar(${k})">★</button>`).join('')}</div>

    <div class="row">${[['ok','✓ できた'],['ng','✗ もう一度'],['pending','⏳ あとで']].map(([v,l])=>`<button class="act ${st.act===v?'on '+v:''}" onclick="st.act='${v}';Lesson()">${l}</button>`).join('')}</div></div>
    <button class="btn" ${st.stars&&(!chk||answered)?'':'disabled'} onclick="saveScore()">記録する（${tries+1}回目）</button>

  h+=`<div class="cnt">合格 / Lulus：<b>${Math.min(n,LIMIT)} / ${LIMIT}</b>　<span class="small">（記録 ${tries}回）</span></div>

}
/* 返事が言えない時：インドネシア語で意味 → 日本語のお手本 */
function replyHint(){const x=lessonBy(st.key);speakSeq([{t:x.reply_id,lang:'id'},{t:x.reply,lang:'ja'}])}
function pickOpt(k){
  const x=lessonBy(st.key);if(st.understood!==null)return;
  st.picked=st.opts[k];st.understood=st.picked===x.boss_id;Lesson();
  speakSeq(st.understood?[{t:'Benar!',lang:'id'},{t:AUTO_ID,lang:'id'}]
    :[{t:'Artinya: '+x.boss_id,lang:'id'},{t:x.boss,lang:'ja'},{t:AUTO_ID,lang:'id'}]);
}
function tapStar(k){st.stars=(st.stars===k?k-1:k);Lesson()}
function saveScore(){
  const x=lessonBy(st.key),nm=curName();if(!nm||!st.stars)return;
  if(count(nm,x.key)>=LIMIT)return toast('この言葉はクリア済みです');
  const chk=needCheck(x);if(chk&&st.understood===null)return toast('先に意味を選んでください');
  const now=new Date(),was=count(nm,x.key);
  const rec={id:now.getTime()+Math.random().toString(36).slice(2,6),date:today(),time:now.toTimeString().slice(0,5),

    stars:st.stars,count:attempts(nm,x.key)+1,understood:chk?st.understood:null,picked:chk?st.picked:'',action:st.act,
    cleared:false,evaluator:S.get('kj_eval',''),sent:false};
  rec.cleared=was+(isPass(rec)?1:0)>=LIMIT;

  if(rec.cleared&&lvDone(nm,x.lv))setTimeout(()=>toast('🎉 レベル'+x.lv+' クリア！次のレベルが開きました'),2700);

}

function quickRecord(ok){
  const x=lessonBy(st.key),nm=curName();if(!nm)return;

function setAction(id,act){

/* ======================================================
   今日の作業指示（v2.0）
   指示 → 復唱OK → 作業確認待ち → 指示どおりできた／やり直し
   端末に必ず保存。GASがあればシート「作業指示」へ同期、LINEで復習
   ====================================================== */
const tasks=()=>S.get('kj_tasks',[]);
const taskBy=id=>tasks().find(t=>t.id===id);
const nowStr=()=>{const d=new Date();return today()+' '+d.toTimeString().slice(0,5)};
const POINTS=['作業名','場所','時間','道具','禁止事項','報告方法'];
const pendTasks=()=>tasks().filter(t=>t.recite==='ok'&&(t.work==='pending'||t.work==='redo'));
const openTasks=()=>tasks().filter(t=>t.recite!=='ok');
function taskState(t){return t.recite!=='ok'?(t.reciteTries?'復唱中（もう一度 '+t.reciteTries+'回）':'復唱前'):t.work==='done'?'指示どおりできた':t.work==='redo'?'やり直しが必要':'作業確認待ち'}
function taskBadge(t){const s=taskState(t),c=t.work==='done'?'#1f7a4d':t.work==='redo'?'#c0392b':t.recite==='ok'?'#d9822b':'#5d6b62';
  return `<span class="tag" style="background:${c};color:#fff">${esc(s)}</span>`}
function saveTask(t){t.updated=nowStr();t.sent=false;const ts=tasks().filter(z=>z.id!==t.id);ts.push(t);S.set('kj_tasks',ts);syncTasks([t])}
async function syncTasks(list){
  if(!hasGas()||!list.length)return false;
  try{await post({action:'task',tasks:list});
    const ids=new Map(list.map(t=>[t.id,t.updated]));
    S.set('kj_tasks',tasks().map(t=>ids.has(t.id)&&ids.get(t.id)===t.updated?{...t,sent:true}:t));return true}
  catch(e){return false}
}
/* 要点の自動チェック（あとで手で直せる） */
function guessPoints(s){
  const p=[];if(s)p.push('作業名');
  if(/(畑|田|倉庫|圃場|ハウス|事務所|小屋|場所|へ|に来|に行)/.test(s))p.push('場所');
  if(/([0-9０-９]+時|分|午前|午後|まで|から|朝|夕方)/.test(s))p.push('時間');
  if(/(機|刈|鎌|スコップ|トラクター|軽トラ|道具|ホース|燃料|ガソリン|手袋|長靴)/.test(s))p.push('道具');
  if(/(ないで|禁止|だめ|ダメ|しない|危な|触らない)/.test(s))p.push('禁止事項');
  if(/(報告|連絡|送って|写真|電話|知らせ)/.test(s))p.push('報告方法');
  return p;
}

const hasGas=()=>!!S.get('kj_gas','');
async function post(body,needRes){
  const url=S.get('kj_gas','');if(!url)throw new Error('GAS未設定');
  try{const r=await fetch(url,{method:'POST',body:JSON.stringify(body)});return await r.json()}
  catch(e){if(needRes)throw e;await fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(body)});return {ok:true,unknown:true}}
}
async function sendRecords(list){

    const ids=new Set(list.map(r=>r.id));S.set('kj_records',records().map(r=>ids.has(r.id)?{...r,sent:true}:r));return true}

/* シートの教材とスマホの教材を「合わせる」（丸ごと置き換えない）
   ・同じ言葉（課題ID）はシートの内容を優先
   ・シートに無い言葉（初期のレベル1も含む）は残して、シートへ書き足す
   ・削除した言葉はシートに「削除」として残るので、削除のまま */
function mergeCurriculum(sheet){
  const local=CUR(),m=new Map(),lm=new Map();
  DEFAULT.lessons.forEach(l=>m.set(l.key,{...l}));
  local.lessons.forEach(l=>m.set(l.key,{...(m.get(l.key)||{}),...l}));
  const sheetKeys=new Set();
  (sheet.lessons||[]).forEach(l=>{if(!l.key)return;sheetKeys.add(String(l.key));
    const clean={};Object.keys(l).forEach(k=>{if(l[k]!==undefined&&l[k]!==null&&!(l[k]===''&&k!=='boss'&&k!=='prompt'&&k!=='prompt_id'))clean[k]=l[k]});
    m.set(l.key,{...(m.get(l.key)||{}),...clean,lv:+l.lv,order:+l.order||0,deleted:!!l.deleted})});
  DEFAULT.levels.forEach(L=>lm.set(+L.lv,{...L}));
  local.levels.forEach(L=>lm.set(+L.lv,{...(lm.get(+L.lv)||{}),...L}));
  const sheetLv=new Set();(sheet.levels||[]).forEach(L=>{sheetLv.add(+L.lv);lm.set(+L.lv,{...(lm.get(+L.lv)||{}),...L,lv:+L.lv})});
  const c={levels:[...lm.values()],lessons:[...m.values()]};
  const fixed=fixCurriculum(c);
  const missing=c.lessons.filter(l=>!sheetKeys.has(String(l.key))||(fixed&&l.key===fixed.key));
  const missingLv=c.levels.filter(L=>!sheetLv.has(+L.lv));
  return {c,missing,missingLv};
}
async function loadCurriculum(silent){
  if(!hasGas())return silent||toast('⚙設定でGASのURLを入れてください');
  try{const r=await post({action:'getLessons'},true);
    if(!r.ok)throw 0;
    const {c,missing,missingLv}=mergeCurriculum(r);
    S.set('kj_curriculum',c);
    if(missing.length||missingLv.length)post({action:'saveAll',levels:missingLv,lessons:missing}).catch(()=>{});   // シートに無い分を書き足す
    if(!silent)toast('✅ 教材を更新しました（'+c.lessons.filter(x=>!x.deleted).length+'件'+(missing.length?'・シートへ'+missing.length+'件書き足し':'')+'）');
    render();
  }catch(e){if(!silent)toast('⚠ 教材を読み込めませんでした')}
}

  if(!title||!v('reply'))return toast('日本人の言葉（または課題名）と研修生の言葉は必須です');
  const c=CUR(),old=st.editKey?lessonBy(st.editKey):null;
  const lv=+$('f_lv').value,moved=!old||+old.lv!==lv,maxO=Math.max(0,...lessonsOf(lv).filter(l=>!old||l.key!==old.key).map(x=>+x.order||0));
  const x={...(old||{}),key:old?old.key:'L'+lv+'-'+Date.now().toString(36),lv,order:moved?maxO+1:old.order,
    icon:v('icon')||'🌾',title,title_id,scene:v('scene'),scene_id:v('scene_id'),
    boss:v('boss'),boss_id:v('boss_id'),reply:v('reply'),kana:v('kana'),romaji:v('romaji')||(v('kana')?toRomaji(v('kana')):''),reply_id:v('reply_id'),prompt:'',prompt_id:'',
    author:S.get('kj_eval',''),updated:today()};
  if(!x.reply_id&&hasGas()&&!confirm('インドネシア語が空です。このまま保存しますか？'))return;
  c.lessons=c.lessons.filter(l=>l.key!==x.key).concat(x);S.set('kj_curriculum',c);
  st.editLv=lv;await syncLesson(x);go('edit');
}
async function deleteLesson(){
  if(!confirm('この言葉を削除しますか？（シートには「削除」として残ります）'))return;
  const c=CUR(),x=c.lessons.find(l=>l.key===st.editKey);x.deleted=true;x.updated=today();S.set('kj_curriculum',c);
  await syncLesson(x);go('edit');
}
async function moveLesson(key,d){
  const ls=lessonsOf(st.editLv),i=ls.findIndex(l=>l.key===key),j=i+d;if(j<0||j>=ls.length)return;
  const c=CUR(),a=c.lessons.find(l=>l.key===ls[i].key),b=c.lessons.find(l=>l.key===ls[j].key);
  ls.forEach((l,k)=>{c.lessons.find(z=>z.key===l.key).order=k+1});[a.order,b.order]=[b.order,a.order];
  S.set('kj_curriculum',c);Edit();
  if(hasGas())post({action:'saveAll',levels:c.levels,lessons:lessonsOf(st.editLv)}).catch(()=>{});
}
async function syncLesson(x){
  if(!hasGas())return toast('この端末に保存しました（シート未設定）');
  try{await post({action:'saveLesson',lesson:x});toast('✅ 保存しました（シートにも保存）')}catch(e){toast('この端末に保存。シートへは「全教材をシートへ保存」で')}
}
async function addLevel(){
  const name=prompt('新しいレベルの名前（日本語）','例：田植えの作業');if(!name)return;
  const c=CUR(),lv=Math.max(0,...c.levels.map(l=>l.lv))+1;
  let name_id='';if(hasGas())try{const r=await post({action:'translate',texts:[name]},true);name_id=r.out[0]}catch(e){}
  c.levels.push({lv,name,name_id});S.set('kj_curriculum',c);st.editLv=lv;
  if(hasGas())post({action:'saveLevel',level:{lv,name,name_id}}).catch(()=>{});toast('レベル'+lv+'を追加しました');Edit();
}
async function editLevel(lv){
  const c=CUR(),L=c.levels.find(l=>l.lv===lv),name=prompt('レベル'+lv+'の名前',L.name);if(!name)return;
  L.name=name;if(hasGas())try{const r=await post({action:'translate',texts:[name]},true);L.name_id=r.out[0]}catch(e){}
  S.set('kj_curriculum',c);if(hasGas())post({action:'saveLevel',level:L}).catch(()=>{});Edit();
}
async function pushAll(){
  if(!hasGas())return toast('⚙設定でGASのURLを入れてください');
  try{const c=CUR();await post({action:'saveAll',levels:c.levels,lessons:c.lessons});toast('✅ 全教材をシートへ保存しました')}catch(e){toast('⚠ 保存できませんでした')}
}
function exportLessons(){
  const head=['レベル','レベル名','順番','課題名','場面','日本人の言葉','研修生の言葉','よみがな','ローマ字','課題名(ID)','場面(ID)','日本人の言葉(ID)','研修生の言葉(ID)'];
  const rows=[];levels().forEach(L=>lessonsOf(L.lv).forEach(x=>rows.push([L.lv,L.name,x.order,x.title,x.scene,x.boss,x.reply,x.kana,x.romaji,x.title_id,x.scene_id,x.boss_id,x.reply_id])));
  downloadCSV([head,...rows],'作業日本語_教材_'+today().replace(/\//g,'')+'.csv');
}

/* ===== ひらがな→ローマ字（簡易） ===== */
function toRomaji(s){
  s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  const T={'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
  'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o','ん':'n',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','、':', ','。':'. ','？':'? ','！':'! ','　':' '};
  let o='',i=0,dbl=false;
  while(i<s.length){
    if(s[i]==='っ'){dbl=true;i++;continue}
    if(s[i]==='ー'){o+=o.slice(-1);i++;continue}
    let r=T[s.substr(i,2)],n=2;if(!r){r=T[s[i]]??s[i];n=1}
    if(dbl&&/^[a-z]/.test(r)){o+=(r.startsWith('ch')?'t':r[0])}dbl=false;o+=r;i+=n;
  }
  o=o.replace(/\s+/g,' ').trim();return o.charAt(0).toUpperCase()+o.slice(1);
}

/* ===== 記録画面 ===== */
function Records(){
  const rs=records().slice().reverse();
  let h=`<div class="card"><h2>📊 学習記録</h2>`;
  students().forEach(n=>{const mine=records().filter(r=>r.name===n);
    const st5=mine.filter(r=>r.stars>0),avg=st5.length?(st5.reduce((s,r)=>s+r.stars,0)/st5.length).toFixed(1):'-',okN=mine.filter(isPass).length;
    const top=levels().filter(L=>lvDone(n,L.lv)).map(L=>L.lv).pop();
    h+=`<div style="margin:8px 0"><b>${esc(n)}</b> <span class="tag">${top?'Lv'+top+'クリア':'Lv1 挑戦中'}</span> <span class="small">記録${mine.length}件・合格${okN}件・平均★${avg}</span></div>`});
  h+=`<div class="row"><button class="btn" onclick="exportCSV()">CSV保存</button><button class="btn sub" onclick="resend()">シートへ再送</button></div></div>
  <div class="card"><table><tr><th>日付</th><th>名前</th><th>言葉</th><th>星</th></tr>`;
  rs.slice(0,150).forEach(r=>h+=`<tr><td>${esc(r.date)}<br><span class="small">${esc(r.time)}</span></td><td>${esc(r.name)}</td><td>${esc(r.reply)}<br><span class="small">Lv${r.lv} ${esc(r.title)} ${r.count}回目${r.cleared?' 🏆':''}</span></td><td>${r.stars?r.stars:(r.action==='ok'?'👌':'🔁')}<br><span class="small">${r.understood===true?'意○':r.understood===false?'意×':''} ${r.action==='ok'?'✓':r.action==='ng'?'✗':r.action==='pending'?'⏳':''}</span>${r.sent?'':'<br><span class="small">未送</span>'}</td></tr>`);
  h+=`</table>${rs.length?'':'<p class="small">まだ記録がありません</p>'}</div>`;
  $app().innerHTML=h;
}
function downloadCSV(rows,fname){
  const csv='﻿'+rows.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=fname;document.body.appendChild(a);a.click();a.remove();
}
function exportCSV(){
  const mk=r=>r.understood===true?'○':r.understood===false?'×':'-',ak=r=>({ok:'✓',ng:'✗',pending:'⏳'})[r.action]||'';
  downloadCSV([['日付','時刻','名前','レベル','課題ID','課題','日本人の言葉','研修生の言葉','星(0=かんたん採点)','回数','クリア','評価者','理解','選んだ意味','作業'],
    ...records().map(r=>[r.date,r.time,r.name,r.lv,r.key,r.title,r.boss,r.reply,r.stars,r.count,r.cleared?'クリア':'',r.evaluator,mk(r),r.picked||'',ak(r)])],
    '作業日本語_記録_'+today().replace(/\//g,'')+'.csv');
}
async function resend(){syncTasks(tasks().filter(t=>!t.sent));const un=records().filter(r=>!r.sent);
  if(!hasGas())return toast('⚙設定でGASのURLを入れてください');if(!un.length)return toast('未送信はありません');
  toast((await sendRecords(un))?un.length+'件送信しました':'送れませんでした');Records()}

function saveSettings(){
  S.set('kj_eval',$('ev').value.trim());S.set('kj_pin',$('pin').value.trim());S.set('kj_gas',$('gas').value.trim());
  toast('保存しました');loadCurriculum(true)}
function delStudent(i){const ss=students(),n=ss.splice(i,1)[0];S.set('kj_students',ss);if(curName()===n)S.set('kj_cur',ss[0]||'');go('settings')}

render();
