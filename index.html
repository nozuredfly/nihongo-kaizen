<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>作業日本語</title>
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="作業日本語">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%231f7a4d'/%3E%3Ctext x='90' y='118' font-size='86' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E日%3C/text%3E%3C/svg%3E">
<script>
(function(){
  const icon="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%231f7a4d'/%3E%3Ctext x='90' y='118' font-size='86' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E日%3C/text%3E%3C/svg%3E";
  const m={name:"作業日本語成長アプリ",short_name:"作業日本語",start_url:location.href.split('#')[0],display:"standalone",background_color:"#f4f7f2",theme_color:"#1f7a4d",icons:[{src:icon,sizes:"180x180",type:"image/svg+xml"}]};
  const l=document.createElement('link');l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));
  document.head.appendChild(l);
})();
</script>
<style>
:root{--g:#1f7a4d;--g2:#e3f2e9;--bg:#f4f7f2;--tx:#1d2a22;--sub:#5d6b62;--warn:#d9822b;--gold:#f2b01e;--blue:#2d6cdf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 12px 12px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;padding:8px 9px;font-size:15px}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.id{color:var(--sub);font-size:13px}
h2{font-size:16px;margin:0 0 8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:bold;background:var(--g);color:#fff;margin-top:10px}
.btn.sub{background:var(--g2);color:var(--g)}
.btn.line{background:#06c755}.btn.blue{background:var(--blue)}.btn.warn{background:var(--warn)}
.btn.sm{padding:9px;font-size:14px;margin-top:0}
.btn:disabled{opacity:.4}
select,input,textarea{width:100%;font-size:16px;padding:11px;border:1px solid #cfd8d2;border-radius:12px;background:#fff;font-family:inherit}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.lesson{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.lesson .ic{font-size:28px;width:40px;text-align:center}
.lesson .t{flex:1;min-width:0}.lesson .t b{display:block;font-size:16px}
.dots{font-size:15px;letter-spacing:2px;color:var(--g);white-space:nowrap;text-align:right}
.lvbar{height:10px;background:#dde5df;border-radius:6px;overflow:hidden;margin:6px 0}
.lvbar i{display:block;height:100%;background:var(--g)}
.step{font-size:13px;font-weight:bold;color:#fff;background:var(--g);display:inline-block;border-radius:8px;padding:2px 8px;margin-bottom:6px}
.boss{background:#fff8e6;border-left:5px solid var(--gold);padding:12px;border-radius:10px}
.reply{background:var(--g2);border-left:5px solid var(--g);padding:12px;border-radius:10px}
.jp{font-size:23px;font-weight:bold;line-height:1.4}
.kana{color:var(--sub);font-size:14px}.romaji{color:var(--g);font-size:15px}.idtx{font-size:15px;margin-top:4px}
.spk{border:0;background:#fff;border-radius:10px;padding:6px 10px;font-size:14px;margin-top:6px}
.starrow{display:flex;justify-content:center;gap:4px;margin:8px 0}
.star{font-size:46px;border:0;background:none;color:#d5dbd7;padding:0 2px;line-height:1}
.star.on{color:var(--gold)}.star:disabled{opacity:.5}
.cnt{text-align:center;font-size:15px;margin-top:4px}
.clear{text-align:center;font-size:17px;font-weight:bold;color:var(--g);background:var(--g2);border-radius:12px;padding:10px;margin-top:10px}
.phrase{border-bottom:1px solid #e8ece9;padding:10px 0}
.phrase:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #e3e8e5;padding:6px 4px;text-align:left;vertical-align:top}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.small{font-size:12px;color:var(--sub)}
.tag{display:inline-block;background:var(--g2);color:var(--g);border-radius:8px;padding:2px 8px;font-size:12px}
.mini{border:0;background:var(--g2);color:var(--g);border-radius:8px;padding:8px 10px;font-size:14px}
</style>
</head>
<body>
<header>
  <button id="backBtn" style="display:none" onclick="back()">◀</button>
  <h1>作業日本語</h1>
  <button onclick="go('book')">📖</button>
  <button onclick="go('records')">📊</button>
  <button onclick="admin('edit')">✏️</button>
  <button onclick="admin('settings')">⚙</button>
</header>
<main id="app"></main>

<script>
/* ======================================================
   初期教材（シートが空のときだけ使う。以後はシートの「教材」が正本）
   ====================================================== */
const DEFAULT={levels:[
  {lv:1,name:"あいさつと仕事の始まり・終わり",name_id:"Salam dan awal-akhir kerja"},
  {lv:2,name:"作業の指示",name_id:"Instruksi kerja"}],
 lessons:[
  {key:"L1-01",lv:1,order:1,icon:"🌅",title:"朝のあいさつ",title_id:"Salam pagi",scene:"朝、会ったとき",scene_id:"Pagi hari, saat bertemu.",boss:"おはようございます。",boss_id:"Selamat pagi.",reply:"おはようございます。",kana:"おはようございます",romaji:"Ohayō gozaimasu.",reply_id:"Selamat pagi."},
  {key:"L1-02",lv:1,order:2,icon:"🌇",title:"帰りのあいさつ",title_id:"Salam pulang kerja",scene:"仕事が終わって帰るとき",scene_id:"Pekerjaan selesai, waktunya pulang.",boss:"お疲れ様でした。",boss_id:"Terima kasih atas kerja kerasnya.",reply:"お疲れ様でした。",kana:"おつかれさまでした",romaji:"Otsukaresama deshita.",reply_id:"Terima kasih atas kerja kerasnya."},
  {key:"L1-03",lv:1,order:3,icon:"☕",title:"休憩の指示",title_id:"Perintah istirahat",scene:"休憩の時間",scene_id:"Waktu istirahat.",boss:"休憩です。",boss_id:"Sekarang istirahat.",reply:"はい、分かりました。",kana:"はい、わかりました",romaji:"Hai, wakarimashita.",reply_id:"Ya, saya mengerti."},
  {key:"L1-04",lv:1,order:4,icon:"🍙",title:"お昼休憩の指示",title_id:"Perintah istirahat siang",scene:"お昼の時間",scene_id:"Waktu makan siang.",boss:"お昼休憩です。",boss_id:"Sekarang istirahat siang.",reply:"はい、分かりました。",kana:"はい、わかりました",romaji:"Hai, wakarimashita.",reply_id:"Ya, saya mengerti."},
  {key:"L1-05",lv:1,order:5,icon:"🧑‍🌾",title:"仕事の始まり",title_id:"Awal kerja",scene:"朝、仕事が始まるとき",scene_id:"Pagi, saat pekerjaan akan dimulai.",boss:"仕事が始まります。",boss_id:"Pekerjaan akan dimulai.",prompt:"今日の仕事を日本語で聞いてください。",prompt_id:"Silakan tanyakan pekerjaan hari ini dalam bahasa Jepang.",reply:"今日の仕事は何ですか？",kana:"きょうのしごとはなんですか",romaji:"Kyō no shigoto wa nan desu ka?",reply_id:"Apa pekerjaan hari ini?"},
  {key:"L1-06",lv:1,order:6,icon:"🧹",title:"仕事の終わり",title_id:"Akhir kerja",scene:"今日の仕事が終わったとき",scene_id:"Saat pekerjaan hari ini selesai.",boss:"今日の仕事は終わりました。",boss_id:"Pekerjaan hari ini sudah selesai.",reply:"はい、分かりました。後片付けをします。",kana:"はい、わかりました。あとかたづけをします",romaji:"Hai, wakarimashita. Atokatazuke o shimasu.",reply_id:"Ya, saya mengerti. Saya akan beres-beres."}
 ]};
const LIMIT=3;   // 1つの言葉の記録は3回まで（3回でクリア）

/* ===== 保存 ===== */
const S={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}},
         set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('保存できませんでした')}}};
const CUR=()=>S.get('kj_curriculum',DEFAULT);
const levels=()=>CUR().levels.slice().sort((a,b)=>a.lv-b.lv);
const lessonsOf=lv=>CUR().lessons.filter(x=>+x.lv===+lv&&!x.deleted).sort((a,b)=>a.order-b.order);
const lessonBy=key=>CUR().lessons.find(x=>x.key===key);
const students=()=>S.get('kj_students',[]);
const records=()=>S.get('kj_records',[]);
const curName=()=>S.get('kj_cur','');
const today=()=>{const d=new Date();return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')};
let st={screen:'home',key:null,stars:0,editLv:1,editKey:null,prev:'home',unlocked:false};

/* ===== 共通 ===== */
function go(s){st.prev=st.screen;st.screen=s;render();scrollTo(0,0)}
function back(){go(st.screen==='lessonEdit'?'edit':st.screen==='lesson'?'home':'home')}
function render(){document.getElementById('backBtn').style.display=st.screen==='home'?'none':'';
  ({home:Home,lesson:Lesson,book:Book,records:Records,settings:Settings,edit:Edit,lessonEdit:LessonEdit})[st.screen]()}
const $=id=>document.getElementById(id);
const $app=()=>$('app');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const starStr=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const count=(name,key)=>records().filter(r=>r.name===name&&r.key===key).length;
const cleared=(name,key)=>count(name,key)>=LIMIT;
const lvDone=(name,lv)=>{const ls=lessonsOf(lv);return ls.length>0&&ls.every(x=>cleared(name,x.key))};
function lvOpen(name,lv){const ls=levels();const i=ls.findIndex(l=>l.lv===lv);return i<=0||lvDone(name,ls[i-1].lv)}
/* ===== 音声（iPhone・Android対策版） ===== */
let JA_VOICE=null,ID_VOICE=null,audioUnlocked=false;
function pickVoice(){
  if(!('speechSynthesis'in window))return;
  const vs=speechSynthesis.getVoices();
  JA_VOICE=vs.find(v=>v.lang==='ja-JP'&&/Kyoko|O-ren|Google|Hattori/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null;
  ID_VOICE=vs.find(v=>/^(id|in)[-_]/i.test(v.lang)&&/Damayanti|Google/i.test(v.name))||vs.find(v=>/^(id|in)([-_]|$)/i.test(v.lang))||null;
}
/* 研修生への指示（インドネシア語の音声） */
const promptId=x=>x.prompt_id||(x.boss?'Silakan jawab dalam bahasa Jepang.':'Silakan bertanya dalam bahasa Jepang.');
/* 日本人の言葉（日本語）→ 指示（インドネシア語）を続けて再生 */
function playScene(x){
  const seq=[];
  if(x.boss)seq.push({t:x.boss,lang:'ja'});
  seq.push({t:promptId(x),lang:'id'});
  speakSeq(seq);
}
function mkUtter(t,lang){
  const u=new SpeechSynthesisUtterance(t);
  if(lang==='id'){u.lang='id-ID';u.rate=.9;if(ID_VOICE)u.voice=ID_VOICE}
  else{u.lang='ja-JP';u.rate=.85;if(JA_VOICE)u.voice=JA_VOICE}
  u.volume=1;u.pitch=1;
  u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast((lang==='id'?'インドネシア語':'日本語')+'の音声エラー：'+e.error)};
  return u;
}
/* 複数の文を一度にまとめて予約（iPhoneはタップ直後に予約しないと鳴らない） */
function speakSeq(seq){
  if(!('speechSynthesis'in window))return toast('この端末は音声に対応していません');
  seq=seq.filter(s=>s.t);if(!seq.length)return;
  if(!JA_VOICE||!ID_VOICE)pickVoice();
  if(seq.some(s=>s.lang==='id')&&!ID_VOICE)toast('インドネシア語の声が端末にありません（⚙の音声テストで確認）');
  const run=()=>{speechSynthesis.resume();window._uq=seq.map(s=>{const u=mkUtter(s.t,s.lang);speechSynthesis.speak(u);return u})};
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(run,250)}else run();
}
function speak(t,lang='ja'){speakSeq([{t,lang}])}
function unlockAudio(){   // iPhoneは最初のタップで一度鳴らさないと音が出ないことがある
  if(audioUnlocked||!('speechSynthesis'in window))return;audioUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}
}
function voiceTest(){
  pickVoice();
  const n=speechSynthesis?speechSynthesis.getVoices().length:0;
  const ng='<b style="color:#c0392b">見つかりません</b>';
  $('vinfo').innerHTML=`音声の数：${n}<br>日本語の声：${JA_VOICE?esc(JA_VOICE.name):ng}<br>インドネシア語の声：${ID_VOICE?esc(ID_VOICE.name):ng}`;
  speakSeq([{t:'おはようございます。音声のテストです。',lang:'ja'},{t:'Silakan ucapkan dalam bahasa Jepang.',lang:'id'}]);
}
if('speechSynthesis'in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
document.addEventListener('touchend',unlockAudio,{once:true});
document.addEventListener('click',unlockAudio,{once:true});
const spk=(t,label='🔊')=>t?`<button class="spk" data-t="${esc(t)}" onclick="speak(this.dataset.t)">${label}</button>`:'';
function nameSelect(){const ss=students(),nm=curName();
  return `<select onchange="S.set('kj_cur',this.value);render()">${ss.map(s=>`<option ${s===nm?'selected':''}>${esc(s)}</option>`).join('')}</select>`}
function admin(s){const pin=S.get('kj_pin','');
  if(pin&&!st.unlocked){const p=prompt('管理者の暗証番号');if(p!==pin)return toast('暗証番号がちがいます');st.unlocked=true}
  go(s)}

/* ===== ホーム ===== */
function Home(){
  const ss=students();
  if(!ss.length){$app().innerHTML=`<div class="card"><h2>研修生を登録 / Daftar nama</h2>
    <p class="id">名前はLINE登録の名前と同じにしてください。</p>
    <input id="newName" placeholder="例: Budi"><button class="btn" onclick="addStudent()">登録</button></div>`;return}
  if(!ss.includes(curName())){S.set('kj_cur',ss[0]);return render()}
  const nm=curName(),td=records().filter(r=>r.name===nm&&r.date===today());
  let h=`<div class="card"><h2>研修生 / Nama</h2>${nameSelect()}
    <div class="small" style="margin-top:8px">今日の記録：${td.length}件 / Hari ini: ${td.length}</div>
    <button class="btn line" ${td.length?'':'disabled'} onclick="sendLine()">📩 今日の結果をLINEで送る</button></div>`;
  levels().forEach(L=>{
    const open=lvOpen(nm,L.lv),ls=lessonsOf(L.lv);
    h+=`<div class="card"><h2>${open?'':'🔒 '}レベル${L.lv}　${esc(L.name)}</h2><div class="id">Level ${L.lv} — ${esc(L.name_id)}</div>`;
    if(!ls.length){h+=`<p class="small">教材は準備中です / Materi segera hadir.</p></div>`;return}
    const c=ls.filter(x=>cleared(nm,x.key)).length;
    h+=`<div class="lvbar"><i style="width:${c/ls.length*100}%"></i></div><div class="small">クリア ${c} / ${ls.length}${c===ls.length?'　🎉 レベルクリア！':''}</div>
    ${open?'':'<p class="small">前のレベルをクリアすると開きます</p>'}</div>`;
    if(open)ls.forEach((x,i)=>{const n=Math.min(count(nm,x.key),LIMIT);
      h+=`<div class="lesson" onclick="openLesson('${x.key}')"><div class="ic">${esc(x.icon)}</div>
      <div class="t"><b>${i+1}. ${esc(x.title)}</b><span class="id">${esc(x.title_id)}</span></div>
      <div class="dots">${n>=LIMIT?'🏆':''}<br>${'●'.repeat(n)}${'○'.repeat(LIMIT-n)}</div></div>`});
  });
  $app().innerHTML=h;
}
function addStudent(){const v=($('newName').value||'').trim();if(!v)return;
  const ss=students();if(!ss.includes(v))ss.push(v);S.set('kj_students',ss);S.set('kj_cur',v);render()}

/* ===== レッスン ===== */
function openLesson(key){st.key=key;st.stars=0;go('lesson');
  if(S.get('kj_autoplay',true))playScene(lessonBy(key))}   // 開いたら自動で「日本語→インドネシア語の指示」
function Lesson(){
  const x=lessonBy(st.key),nm=curName(),n=count(nm,x.key),done=n>=LIMIT;
  const ls=lessonsOf(x.lv),i=ls.findIndex(l=>l.key===x.key);
  let h=`<div class="card">${nameSelect()}</div>
  <div class="card"><div class="id">Level ${x.lv} — ${i+1}/${ls.length}</div>
  <h2>${esc(x.icon)} ${esc(x.title)} <span class="id">/ ${esc(x.title_id)}</span></h2>
  <div class="id">📍 ${esc(x.scene)}<br>${esc(x.scene_id)}</div></div>
  <button class="btn blue" onclick="playScene(lessonBy(st.key))">▶ 再生 / Putar（日本語 → 🇮🇩 指示）</button>
  <div class="card" style="margin-top:12px"><span class="step">① 日本人 / Orang Jepang</span>`;
  h+=x.boss?`<div class="boss"><div class="jp">「${esc(x.boss)}」</div><div class="idtx">🇮🇩 ${esc(x.boss_id)}</div>${spk(x.boss,'🔊 日本語')}</div>`
    :`<div class="boss"><div class="idtx">研修生から先に話します。<br>🇮🇩 Anda yang bicara duluan.</div></div>`;
  h+=`<div style="margin-top:12px"><span class="step">② 研修生 / Peserta</span>
  <div class="reply"><div class="idtx" style="margin:0 0 6px"><b>🇮🇩 ${esc(promptId(x))}</b><br><span class="small">（日本語で${x.boss?'答えて':'聞いて'}ください）</span>
    <button class="spk" data-t="${esc(promptId(x))}" onclick="speak(this.dataset.t,'id')">🔊 Indonesia</button></div>
    <div class="jp">「${esc(x.reply)}」</div><div class="kana">${esc(x.kana)}</div>
    <div class="romaji">${esc(x.romaji)}</div><div class="idtx">🇮🇩 ${esc(x.reply_id)}</div>${spk(x.reply,'🔊 お手本 / Contoh')}</div></div></div>
  <div class="card"><span class="step">③ 採点 / Nilai</span>`;
  if(done){h+=`<div class="clear">🏆 クリア済み / Sudah lulus</div>
    <p class="small" style="text-align:center">記録は${LIMIT}回までです。ここからは会話練習として自由に使えます。<br>Sekarang bebas dipakai untuk latihan percakapan.</p>`}
  else{h+=`<div class="starrow">${[1,2,3,4,5].map(k=>`<button class="star ${k<=st.stars?'on':''}" onclick="tapStar(${k})">★</button>`).join('')}</div>
    <div class="cnt">${st.stars?st.stars+' / 5':'星をタップ / Ketuk bintang'}</div>
    <button class="btn" ${st.stars?'':'disabled'} onclick="saveScore()">この星で記録する（${n+1}回目）</button>`}
  h+=`<div class="cnt" style="margin-top:12px">記録 / Catatan：<b>${Math.min(n,LIMIT)} / ${LIMIT}</b></div></div>
  <div class="row"><button class="btn sub" ${i<=0?'disabled':''} onclick="openLesson('${ls[i-1]?.key}')">◀ 前</button>
  <button class="btn sub" ${i>=ls.length-1?'disabled':''} onclick="openLesson('${ls[i+1]?.key}')">次 ▶</button></div>`;
  $app().innerHTML=h;
}
function tapStar(k){st.stars=(st.stars===k?k-1:k);Lesson()}
function saveScore(){
  const x=lessonBy(st.key),nm=curName();if(!nm||!st.stars)return;
  if(count(nm,x.key)>=LIMIT)return toast('記録は3回までです');
  const now=new Date(),c=count(nm,x.key)+1;
  const rec={id:now.getTime()+Math.random().toString(36).slice(2,6),date:today(),time:now.toTimeString().slice(0,5),

/* ===== GAS 通信 ===== */
const hasGas=()=>!!S.get('kj_gas','');
async function post(body,needRes){
  const url=S.get('kj_gas','');if(!url)throw new Error('GAS未設定');
  try{const r=await fetch(url,{method:'POST',body:JSON.stringify(body)});return await r.json()}
  catch(e){if(needRes)throw e;await fetch(url,{method:'POST',mode:'no-cors',body:JSON.stringify(body)});return {ok:true,unknown:true}}
}
async function sendRecords(list){
  if(!hasGas()||!list.length)return false;
  try{await post({action:'record',records:list,limit:LIMIT});
    const ids=new Set(list.map(r=>r.id));S.set('kj_records',records().map(r=>ids.has(r.id)?{...r,sent:true}:r));return true}
  catch(e){return false}
}

/* ===== ひらがな→ローマ字（簡易） ===== */
function toRomaji(s){
  s=s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  const T={'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho','ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo','ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo','りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo','じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo','ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
  'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':'o','ん':'n',
  'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo','ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','、':', ','。':'. ','？':'? ','！':'! ','　':' '};
  let o='',i=0,dbl=false;
  while(i<s.length){
    if(s[i]==='っ'){dbl=true;i++;continue}
    if(s[i]==='ー'){o+=o.slice(-1);i++;continue}
    let r=T[s.substr(i,2)],n=2;if(!r){r=T[s[i]]??s[i];n=1}
    if(dbl&&/^[a-z]/.test(r)){o+=(r.startsWith('ch')?'t':r[0])}dbl=false;o+=r;i+=n;
  }
  o=o.replace(/\s+/g,' ').trim();return o.charAt(0).toUpperCase()+o.slice(1);
}
